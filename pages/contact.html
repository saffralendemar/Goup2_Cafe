<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/contact.css">
</head>

<body class="contact-page">

    <nav class="nav">
        <a class="nav__link" href="../index.html">Home</a>
        <a class="nav__link" href="gallery.html">Gallery</a>
        <a class="nav__link" href="about.html">About us</a>
        <a class="nav__link" href="contact.html">Contact Us</a>
    </nav>

    <main class="contact">

        <section class="contact__info">
            <h1 class="contact__title">Contact us</h1>

            <p class="contact__text">(456) 789-12301</p>
            <p class="contact__text">info@modrino.co.uk</p>
            <p class="contact__text">South 13th Street</p>
            <p class="contact__text">New York America</p>
        </section>

        <section class="contact__form">

            <form class="form">

                <label class="form__label" for="email">E-mail</label>
                <input
                    class="form__input"
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your e-mail"
                    required
                >

                <label class="form__label" for="subject">Subject</label>
                <input
                    class="form__input"
                    type="text"
                    id="subject"
                    name="subject"
                    placeholder="Enter your subject"
                    required
                >

                <label class="form__label" for="message">Message</label>
                <textarea
                    class="form__textarea"
                    id="message"
                    name="message"
                    placeholder="Enter your message"
                    required
                ></textarea>

                <button class="form__button" type="submit">Send</button>

            </form>

        </section>

    </main>

    <footer class="footer">

        <section class="footer__contact">
            <h2 class="footer__title">Contact us</h2>

            <p class="footer__text">(456) 789-12301</p>
            <p class="footer__text">info@modrino.co.uk</p>
            <p class="footer__text">South 13th street</p>
            <p class="footer__text">New York America</p>
        </section>

        <nav class="footer__nav">
            <h2 class="footer__title">Explore</h2>

            <a class="footer__link" href="../index.html">Home</a>
            <a class="footer__link" href="gallery.html">Gallery</a>
            <a class="footer__link" href="about.html">About us</a>
            <a class="footer__link" href="contact.html">Contact us</a>
        </nav>

        <section class="footer__social">
            <h2 class="footer__title">Follow us</h2>
        </section>

    </footer>

</body>
</html>
