<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/contact.css">
</head>

<body>

<header class="header">
    <span class="logotype"></span>

    <nav>
        <ul class="header__list">
            <li>
                <a class="header__link" href="../index.html">Home</a>
            </li>
            <li>
                <a class="header__link" href="gallery.html">Gallery</a>
            </li>
            <li>
                <a class="header__link" href="about.html">About us</a>
            </li>
            <li>
                <a class="header__link" href="contact.html">Contact Us</a>
            </li>
        </ul>
    </nav>
</header>

<main class="contact">

    <section class="contact__info">
        <h1>Contact us</h1>

        <p>(456) 789-12301</p>
        <p>info@modrino.co.uk</p>
        <p>South 13th Street</p>
        <p>New York America</p>
    </section>

    <section class="contact__form">
        <form class="form">

            <label class="form__label" for="email">E-mail</label>
            <input
                class="form__input"
                type="email"
                id="email"
                name="email"
                placeholder="Enter your e-mail"
                required
            >

            <label class="form__label" for="subject">Subject</label>
            <input
                class="form__input"
                type="text"
                id="subject"
                name="subject"
                placeholder="Enter your subject"
                required
            >

            <label class="form__label" for="message">Message</label>
            <textarea
                class="form__textarea"
                id="message"
                name="message"
                placeholder="Enter your message"
                required
            ></textarea>

            <button class="button button--primary form__button" type="submit">
                Send
            </button>

        </form>
    </section>

</main>

<footer class="footer">

    <section class="footer__section">
        <h2>Contact us</h2>
        <p>(456) 789-12301</p>
        <p>info@modrino.co.uk</p>
        <p>South 13th street</p>
        <p>New York America</p>
    </section>

    <nav class="footer__section">
        <h2>Explore</h2>
        <a href="../index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="about.html">About us</a>
        <a href="contact.html">Contact us</a>
    </nav>

    <section class="footer__section">
        <h2>Follow us</h2>
        <p>Follow us on social media</p>
    </section>

</footer>

</body>
</html>
